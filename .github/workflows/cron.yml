name: Alex Study Scheduled Cron Jobs

on:
  schedule:
    # 1. Run hourly jobs (Challenges & Reminders)
    - cron: '0 * * * *'
    # 2. Run daily maintenance jobs at 20:00 UTC
    - cron: '0 20 * * *'
    # 3. Run weekly leaderboards calculation on Sunday at 23:00 UTC
    - cron: '0 23 * * 0'
  # Allows manual triggering from GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  run-cron-tasks:
    name: Execute Scheduled Jobs on Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Send Authorized Cron Requests
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in GitHub Secrets. Please configure them in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Remove trailing slash from APP_URL if present
          BASE_URL="${APP_URL%/}"
          echo "🚀 Calling Alex Study internal cron endpoints on: $BASE_URL"

          # A failing job used to end in `|| echo "⚠️ warning"` (audit M14): the pipeline
          # looked green forever while background work silently stopped. Failures are now
          # collected and the step -- and therefore the workflow -- goes red at the end,
          # so a dead job page is something an operator actually sees.
          FAILURES=0

          run_job() {
            local label="$1"; local path="$2"
            echo "⚡ Triggering ${label}..."
            if ! curl -f -s --max-time 120 -X POST "$BASE_URL$path" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"; then
              echo "::error::${label} failed"
              FAILURES=$((FAILURES + 1))
            fi
          }

          # 1. Challenges Lifecycle
          run_job "Challenges Lifecycle" "/api/internal/jobs/challenges"

          # 2. Accountability Reminders
          run_job "Accountability Reminders" "/api/internal/jobs/accountability-reminders"

          # 3. Daily Maintenance & Insights (Runs at 20:00 UTC or on Manual Run)
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_job "AI Cleanup" "/api/internal/jobs/cleanup"
            run_job "Burnout Detection" "/api/internal/jobs/burnout-detection"
            run_job "Performance Detection" "/api/internal/jobs/performance-detection"
            run_job "AI Recaps" "/api/internal/jobs/ai-recaps"
          fi

          # 4. Weekly Leaderboards (Sunday 23:00 UTC or Manual Run)
          if [ "${{ github.event.schedule }}" = "0 23 * * 0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_job "Weekly Leaderboards Calculation" "/api/internal/jobs/weekly-leaderboards"
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} scheduled job(s) failed."
            exit 1
          fi

          echo "✅ Scheduled tasks finished successfully!"
